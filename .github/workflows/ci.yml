name: Order Checker regression checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Block release on build, type or audit regression failures
        run: npm run verify:release
      - name: Install browser for the General Auditor workflow gate
        run: npx playwright install --with-deps chromium
      - name: Verify General Auditor input, extraction, CCA decisions and results in Chromium
        run: npm run test:general:browser
